name: howlong-brand
on:
  workflow_dispatch:
    inputs:
      hide_old:
        description: Eski Almanca videoları gizle (true/false)
        default: "false"
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q Pillow google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python howlong_brand.py --apply ${{ inputs.hide_old == 'true' && '--hide-old' || '' }}
      - run: |
          git config user.name "howlong-bot"; git config user.email "bot@users.noreply.github.com"
          git add hidden_old.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "howlong: gizlenen eski videolar"; git stash -q -u || true
          git pull --rebase -q && git push -q
