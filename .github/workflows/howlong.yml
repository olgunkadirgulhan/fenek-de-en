name: howlong
# How Long Would It Take? (2026-10-14). Kota gününün SONUNDA yükler (00-06 UTC; aynı Google projesindeki Bloop'tan sonra),
# publishAt ile ABD izlenme saatinde yayınlar. Her çalışma 1 video: önce 3 Short, sonra 2 uzun (howlong.py --auto).
on:
  schedule:
    - cron: "23 0-6 * * *"
    - cron: "53 0-6 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: Harici zamanlayıcı (cron-job.org) - planlı çalışma gibi davran
        type: boolean
        default: false
      dry_run:
        description: Render only, no upload
        type: boolean
        default: true
      mode:
        description: "short | long"
        default: short
      kurgu:
        description: "guess | race | ladder | light (boş = rastgele)"
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  make:
    if: (github.event_name != 'schedule' && !inputs.auto) || vars.CONTENT_MODE == 'howlong'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu Pillow "kokoro>=0.9.4" soundfile "misaki[en]" "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" google-api-python-client google-auth requests
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          SHORTS_PER_DAY: ${{ vars.SHORTS_PER_DAY || '3' }}
          LONGS_PER_DAY: ${{ vars.LONGS_PER_DAY || '2' }}
          LONG_DAYS: ${{ vars.LONG_DAYS || 'mon,wed,fri' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; then python howlong.py --auto; exit 0; fi
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          [ "${{ inputs.mode }}" = "long" ] && ARGS="$ARGS --long"
          [ -n "${{ inputs.kurgu }}" ] && ARGS="$ARGS --kurgu ${{ inputs.kurgu }}"
          python howlong.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: howlong-${{ github.run_id }}
          path: out/howlong/*.mp4
          retention-days: 5
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "howlong-bot"; git config user.email "bot@users.noreply.github.com"
          git add howlong_published.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "howlong: $(date -u +%F-%H%M)"
          git pull --rebase -q && git push -q
