name: emoji-brand
# Emoji bulmaca kanalı: banner + açıklama + anahtar kelimeler (emoji_brand.py --apply)
on:
  workflow_dispatch:
jobs:
  brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q Pillow numpy google-api-python-client google-auth requests
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: python emoji_brand.py --apply
