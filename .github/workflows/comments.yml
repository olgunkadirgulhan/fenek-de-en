name: comments
# Yeni videolara videoya özel ilk yorum + yorumlara kişisel cevap (tools/auto_reply.py), saatte bir
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth requests
      - name: German with Fenek
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: "German with Fenek"
          CHANNEL_ABOUT: "Short German lessons for English speakers (A1-B1)."
          CHANNEL_KIND: general
          CHANNEL_LANG: en
          STATE_FILE: comment_replies.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_QUESTIONS: "[\"Which {topic} word was new to you? 🤔\", \"How many did you get right? ✍️\", \"Can you make a sentence about {topic} in German? 🇩🇪\", \"Der, die or das: which one tricked you? 😅\", \"What topic should we learn after {topic}? 💡\", \"Which word would you use first in Germany? 🇩🇪\", \"Did you understand everything without subtitles? 👀\", \"Write one {topic} word you already knew 👇\", \"Which word is the hardest to pronounce? 🗣️\", \"What's your German level right now: A1, A2 or B1? 📚\", \"Where are you learning German from? 🌍\", \"Would you survive this {topic} situation in Germany? 😄\", \"Which word sounds the funniest to you? 😂\", \"How long have you been learning German? ⏳\", \"Try it: translate one {topic} word in the comments ✍️\"]"
        run: python tools/auto_reply.py
      - run: |
          git config user.name "comment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comment_replies*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "comments: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
