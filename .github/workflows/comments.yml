name: comments
# Yeni videolara videoya özel ilk yorum + yorumlara kişisel cevap (tools/auto_reply.py), saatte bir
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth requests
      - name: German with Fenek
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: "How Long Would It Take?"
          CHANNEL_ABOUT: "Timed thought experiments: how long it would take to reach places (the Moon, Mars, Everest) at different speeds, from a snail to light, using NASA and NOAA distances."
          CHANNEL_KIND: general
          CHANNEL_LANG: en
          STATE_FILE: comment_replies.json
          REQUESTS_FILE: viewer_requests.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_QUESTIONS: "[\"Did you guess right? 🤔\", \"What should we time next? ⏱️\", \"Which speed surprised you the most? 🚀\", \"Name a place and a speed and we will time it! 👇\", \"Would you make this trip? 🌍\", \"Was your guess too high or too low? 📏\", \"What is the farthest you have ever traveled? ✈️\"]"
        run: python tools/auto_reply.py
      - run: |
          git config user.name "comment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comment_replies*.json viewer_requests*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "comments: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
