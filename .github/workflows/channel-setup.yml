name: channel-setup
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Kanalı özelleştir
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/channel_setup.py
      - name: playlists.json kaydet
        run: |
          git config user.name "fenek-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -e playlists.json ] && git add playlists.json || true
          git diff --cached --quiet && exit 0
          git commit -m "channel: playlists"
          git pull --rebase
          git push
